# Crusoe MI355X Slurm cluster facts (from .claude/skills/crusoe-arbor-run). Isolated here so a later cluster gets its own file.
name: crusoe
# The baseline site (user decision 2026-11-21): baselines and their ceilings are measured here only.
baselines: true
login_hosts: [crsuse2-slog-006.crusoe.amd.com, crsuse2-slog-005.crusoe.amd.com]   # 005 stopped answering 2026-11-20; login shell is tcsh -> wrap multi-step commands in `bash -c` or a script
login_shell: tcsh
partition: amd-spur-v2
qos: amd-hyperloom-qos
qos_group_node_limit: 5         # a released node may not come back
gpu_type: mi355x
gpus_per_node: 8
hold_job:
  submit_time: "1-00:00:00"     # a pending job longer than the QOS max wall is blocked
  max_time: "3-00:00:00"        # raise with scontrol once RUNNING
  ctrl_poll_s: 20
# Orchestrator rule (design.md section 6): only short-lived ssh calls to the login node; nothing long-lived runs there.
scheduler: spur                 # Slurm-compatible "spur 0.15.0": sacct has no -X/-P (verified 2026-11-19, sacct --help)
# User decision 2026-11-20: this project runs on burst (account amd-hyperloom). Limits (sacctmgr, 2026-11-20): 24 h
# wall, 4 submitted / 8 running jobs per user, preempt mode cancel (almost every other QOS may cancel a burst job: a
# cancelled A/B run is rerun whole, never resumed on another node). A job must fit 24 h (render.job_minutes).
qos_default: amd-burst-qos
account_default: amd-hyperloom
# The earlier default (2026-11-19): 2 jobs / 2 nodes per user, 48 h wall, not preempted.
qos_fallback: { qos: amd-agentx-qos, account: amd-agentx }
# MaxWall per QOS (sacctmgr show qos, 2026-11-20): a longer --time pends forever, so the backend refuses it.
qos_max_wall_minutes: { amd-burst-qos: 1440, amd-agentx-qos: 2880, amd-hyperloom-qos: 2880 }
# LLM gateway for Arbor's agents (format of the earlier campaigns' gateway.env, verified 2026-11-19). The subscription
# key itself is never here: scripts/setup_remote.py writes it into <work_root>/secrets/gateway.env (mode 600).
llm_gateway:
  base_url: https://llm-api.amd.com/Anthropic
  key_header: Ocp-Apim-Subscription-Key
  api_key_placeholder: dummy
  models: { default: Claude-Opus-5.5, opus: Claude-Opus-5.5, sonnet: Claude-Sonnet-4.6, haiku: Claude-Haiku-4.5 }
