# Crusoe MI355X Slurm cluster facts (from .claude/skills/crusoe-arbor-run). Isolated here so a later cluster gets its own file.
name: crusoe
login_host_alias: crs5          # ssh alias; login shell is tcsh -> wrap multi-step commands in `bash -c` or a script
login_shell: tcsh
partition: amd-spur-v2
qos: amd-hyperloom-qos
qos_group_node_limit: 5         # a released node may not come back
gpu_type: mi355x
gpus_per_node: 8
hold_job:
  submit_time: "1-00:00:00"     # a pending job longer than the QOS max wall is blocked
  max_time: "3-00:00:00"        # raise with scontrol once RUNNING
  ctrl_poll_s: 20
# Orchestrator rule (design.md section 6): only short-lived ssh calls to the login node; nothing long-lived runs there.
scheduler: spur                 # Slurm-compatible "spur 0.15.0": sacct has no -X/-P (verified 2026-11-19, sacct --help)
qos_default: amd-agentx-qos     # user decision 2026-11-19: agentx (account amd-agentx), burst as fallback
account_default: amd-agentx
# Fallback when agentx is at its 10-node group limit (QOSGrpNodeLimit): qos amd-burst-qos with account amd-hyperloom
# (the account the user's burst jobs run under, 2026-11-19); 24 h wall, preempt mode cancel: short runs only.
qos_fallback: { qos: amd-burst-qos, account: amd-hyperloom }
# LLM gateway for Arbor's agents (format of the earlier campaigns' gateway.env, verified 2026-11-19). The subscription
# key itself is never here: scripts/setup_remote.py writes it into <work_root>/secrets/gateway.env (mode 600).
llm_gateway:
  base_url: https://llm-api.amd.com/Anthropic
  key_header: Ocp-Apim-Subscription-Key
  api_key_placeholder: dummy
  models: { default: Claude-Opus-5.5, opus: Claude-Opus-5.5, sonnet: Claude-Sonnet-4.6, haiku: Claude-Haiku-4.5 }
